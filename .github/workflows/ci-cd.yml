name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1) Pruebas unitarias + política de calidad (cobertura >= 70%)
  # ---------------------------------------------------------------
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pruebas unitarias y verificación de cobertura (JaCoCo)
        run: mvn -B -ntp verify
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
      - name: Alerta si fallan pruebas o cobertura
        if: failure()
        run: echo "::error title=Calidad::Fallaron las pruebas o no se alcanzó el 70% de cobertura. Pipeline bloqueado."

  # ---------------------------------------------------------------
  # 2) Seguridad: escaneo de dependencias con Snyk (bloquea si falla)
  # ---------------------------------------------------------------
  security:
    name: Análisis de seguridad
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: snyk/actions/setup@master
      - name: Escaneo de dependencias con Snyk
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Alerta si falla el análisis de seguridad
        if: failure()
        run: echo "::error title=Seguridad::Snyk encontró vulnerabilidades de severidad alta o crítica. Construcción y despliegue bloqueados."

  # ---------------------------------------------------------------
  # 3) Construir la imagen Docker (se publica solo en push a main)
  # ---------------------------------------------------------------
  build:
    name: Imagen Docker
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de imagen en minúsculas
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Construir (y publicar si es push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 4) Despliegue automático en entorno simulado (Docker Compose)
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue en staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      DB_NAME: orderdb
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Descargar la imagen publicada por este commit
        run: docker compose pull app
      - name: Levantar el entorno con Docker Compose
        run: docker compose up -d --no-build
      - name: Esperar a que la aplicación esté sana
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8098/actuator/health | grep -q '"status":"UP"'; then
              echo "Aplicación saludable"
              exit 0
            fi
            sleep 5
          done
          echo "La aplicación no respondió a tiempo"
          docker compose logs app
          exit 1
      - name: Prueba de humo (crear y listar un pedido)
        run: |
          curl -fsS -X POST http://localhost:8098/api/orders \
            -H "Content-Type: application/json" \
            -d '{"customerName":"CI","items":[{"productName":"Prueba","quantity":1,"unitPrice":1000.00}]}'
          curl -fsS http://localhost:8098/api/orders
      - name: Resumen de trazabilidad
        if: always()
        run: |
          echo "### Despliegue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Autor: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ejecución: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Limpiar entorno
        if: always()
        run: docker compose down -v