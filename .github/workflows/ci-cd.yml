name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1) Pruebas unitarias + política de calidad (cobertura >= 70%)
  # ---------------------------------------------------------------
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pruebas unitarias y verificación de cobertura (JaCoCo)
        run: mvn -B -ntp verify
      - name: Calcular cobertura de líneas
        id: cov
        run: |
          COV=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {if (m+c>0) printf "%.1f", c*100/(m+c); else print 0}' target/site/jacoco/jacoco.csv)
          echo "coverage=${COV}" >> "$GITHUB_OUTPUT"
          echo "Cobertura de líneas: ${COV}%"
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
      - name: Alerta si fallan pruebas o cobertura
        if: failure()
        run: echo "::error title=Calidad::Fallaron las pruebas o no se alcanzó el 70% de cobertura. Pipeline bloqueado."

  # ---------------------------------------------------------------
  # 2) Seguridad: escaneo de dependencias con Snyk (bloquea si falla)
  # ---------------------------------------------------------------
  security:
    name: Análisis de seguridad
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: snyk/actions/setup@master
      - name: Escaneo de dependencias con Snyk
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Alerta si falla el análisis de seguridad
        if: failure()
        run: echo "::error title=Seguridad::Snyk encontró vulnerabilidades de severidad alta o crítica. Construcción y despliegue bloqueados."

  # ---------------------------------------------------------------
  # 3) Cumplimiento: auditoría de políticas y búsqueda de secretos
  # ---------------------------------------------------------------
  compliance:
    name: Cumplimiento
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auditoría de políticas
        run: bash scripts/audit.sh
      - name: Búsqueda de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------------------------------------------
  # Escaneo de la imagen Docker con Trivy (bloquea ante críticas)
  # ---------------------------------------------------------------
  image-scan:
    name: Escaneo de imagen (Trivy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen para analizarla
        run: docker build -t order-manager:scan .
      - name: Escaneo con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: order-manager:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      # ---------------------------------------------------------------
  # Calidad de código: SonarCloud con quality gate (bloquea si falla)
  # ---------------------------------------------------------------
  sonar:
    name: Calidad de código (SonarCloud)
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Análisis con SonarCloud y quality gate
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B -ntp verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=alanburgossepulveda
          -Dsonar.projectKey=alanburgossepulveda_Evaluacion-2-Devops
          -Dsonar.qualitygate.wait=true
 
  # ---------------------------------------------------------------
  # 4) Construir la imagen Docker (se publica solo en push a main)
  # ---------------------------------------------------------------
  build:
    name: Imagen Docker
    needs: [security, compliance, image-scan, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de imagen en minúsculas
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Construir (y publicar si es push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 5) Despliegue automático en entorno simulado (Docker Compose)
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue en staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      DB_NAME: orderdb
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Descargar la imagen publicada por este commit
        run: docker compose pull app
      - name: Levantar el entorno con Docker Compose
        run: docker compose up -d --no-build
      - name: Esperar a que la aplicación esté sana
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8098/actuator/health | grep -q '"status":"UP"'; then
              echo "Aplicación saludable"
              exit 0
            fi
            sleep 5
          done
          echo "La aplicación no respondió a tiempo"
          docker compose logs app
          exit 1
      - name: Prueba de humo (crear y listar un pedido)
        run: |
          curl -fsS -X POST http://localhost:8098/api/orders \
            -H "Content-Type: application/json" \
            -d '{"customerName":"CI","items":[{"productName":"Prueba","quantity":1,"unitPrice":1000.00}]}'
          curl -fsS http://localhost:8098/api/orders
      - name: Resumen de trazabilidad
        if: always()
        run: |
          echo "### Despliegue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Autor: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ejecución: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Limpiar entorno
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------
  # 6) Despliegue automático en Kubernetes (Amazon EKS)
  # ---------------------------------------------------------------
  deploy-eks:
    name: Despliegue en EKS
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: eks
    steps:
      - name: Marcar inicio del despliegue
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Conectar con el clúster
        run: aws eks update-kubeconfig --region us-east-1 --name order-manager-eks

      - name: Desplegar la imagen del commit
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres-aws.yaml
          sed "s|image: order-manager:latest|image: ${IMAGE}|" k8s/app.yaml | kubectl apply -f -
          kubectl rollout status deployment/order-manager -n order-manager --timeout=300s
          kubectl apply -f k8s/monitoring/prometheus.yaml
          kubectl apply -f k8s/monitoring/grafana.yaml
          kubectl apply -f k8s/monitoring/pushgateway.yaml
          kubectl rollout status deployment/prometheus -n monitoring --timeout=180s
          kubectl rollout status deployment/grafana -n monitoring --timeout=180s

      - name: Publicar métricas del pipeline
        if: always()
        env:
          COVERAGE: ${{ needs.test.outputs.coverage }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          DURATION=$(( $(date +%s) - T0 ))
          OK=0
          if [ "$DEPLOY_STATUS" = "success" ]; then OK=1; fi
          kubectl rollout status deployment/pushgateway -n monitoring --timeout=120s
          kubectl port-forward -n monitoring svc/pushgateway 9091:9091 >/dev/null 2>&1 &
          sleep 8
          cat <<EOF | curl -fsS --data-binary @- http://localhost:9091/metrics/job/cicd/instance/eks
          # TYPE ci_test_coverage_percent gauge
          ci_test_coverage_percent ${COVERAGE}
          # TYPE ci_deploy_duration_seconds gauge
          ci_deploy_duration_seconds ${DURATION}
          # TYPE ci_deploy_success gauge
          ci_deploy_success ${OK}
          # TYPE ci_deploy_timestamp_seconds gauge
          ci_deploy_timestamp_seconds $(date +%s)
          EOF

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue en EKS"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Imagen: \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}\`"
            echo "- Ejecución: #${GITHUB_RUN_NUMBER}"
            echo
            kubectl get pods -n order-manager
            echo
            kubectl get pods -n monitoring
          } >> "$GITHUB_STEP_SUMMARY"