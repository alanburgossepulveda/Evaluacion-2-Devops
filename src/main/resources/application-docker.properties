# Base de datos PostgreSQL (los valores llegan desde variables de entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:orderdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: conservar los datos entre reinicios y no volcar SQL al log
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad: sin consola H2 y sin detalles internos en /actuator/health
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never