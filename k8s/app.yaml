apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-manager
  namespace: order-manager
  labels:
    app: order-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-manager
  template:
    metadata:
      labels:
        app: order-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8098"
    spec:
      containers:
        - name: order-manager
          image: order-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8098
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_PASSWORD }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8098 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8098 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8098 }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-manager
  namespace: order-manager
spec:
  selector:
    app: order-manager
  ports:
    - port: 8098
      targetPort: 8098